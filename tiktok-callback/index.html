<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PulsePost — Connecting TikTok</title>
<style>
  :root { --bg:#ffffff; --fg:#1b1f24; --muted:#5b6470; --accent:#3b6ef6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6e9ee; --muted:#9aa4b1; --accent:#6f98ff; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; padding:0 16px; }
  p { color:var(--muted); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Connecting TikTok…</h1>
  <p>Returning you to PulsePost. <a id="go" href="https://localhost:3000/">Continue</a> if nothing happens.</p>
</main>
<script>
  // TikTok does not accept localhost redirect URIs, so it sends the login back
  // here and this page hands the code and state to the local PulsePost server.
  var target = 'https://localhost:3000/api/accounts/callback/tiktok' + location.search;
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>
